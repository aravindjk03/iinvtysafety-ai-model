[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-safety-model-lab"
version = "0.2.0"
description = "Industrial AI Safety Model Lab - Pretrained and Custom Safety Model Registry & Lifecycle Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AI Safety Workshop Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
ai-safety = "ai_safety.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers -m 'not integration'"
markers = [
    "integration: marks tests as slow integration tests (run with 'pytest -m integration')",
]

